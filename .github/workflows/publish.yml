name: Publish
on:
  push:
    tags: ['cli-v*']
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/cli.yml
  binaries:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, dir: darwin-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, dir: darwin-x64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, dir: linux-x64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, dir: linux-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, dir: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test
        working-directory: server
      - run: cargo build --release --target ${{ matrix.target }}
        working-directory: server
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dir }}
          path: |
            target/${{ matrix.target }}/release/ramulus
            target/${{ matrix.target }}/release/ramulus.exe
          if-no-files-found: error
  publish:
    needs: [test, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12
      - run: test "cli-v$(node -p "require('./cli/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: cli
      # one folder per platform, named as the bin stub looks them up: native/<platform>-<arch>/ramulus
      - uses: actions/download-artifact@v4
        with:
          path: cli/native
      - run: chmod +x cli/native/*/ramulus* && ls -la cli/native/*
      - run: npm publish --access public
        working-directory: cli
