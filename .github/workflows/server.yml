name: Server
on:
  push:
    branches: [main]
    paths: ['server/**', 'Cargo.*', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'Cargo.*', '.github/workflows/server.yml']
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        working-directory: server
      - run: cargo build --release
        working-directory: server
