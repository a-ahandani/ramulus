[package]
name = "ramulus-desktop"
version = "0.7.0"
edition = "2021"
license = "MIT"
description = "Ramulus as a desktop app: the native helper and the UI in one window."
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ramulus = { path = "../../server" }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["net"] }
getrandom = "0.3"
