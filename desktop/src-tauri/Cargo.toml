[package]
name = "ramulus-desktop"
version = "0.14.1"
edition = "2021"
license = "MIT"
description = "Ramulus as a desktop app: the native helper and the UI in one window."
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ramulus = { path = "../../server" }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["net", "time"] }
getrandom = "0.3"
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
