[package]
name = "ramulus"
version = "0.8.0"
edition = "2021"
license = "MIT"
description = "Every branch of your repository in one graph. Runs a local server on top of your installed git and opens the UI in your browser."
repository = "https://github.com/a-ahandani/ramulus"
publish = false

[[bin]]
name = "ramulus"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
portable-pty = "0.9"
async-stream = "0.3"
futures-core = "0.3"
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
ureq = { version = "3", default-features = false, features = ["json"] }
